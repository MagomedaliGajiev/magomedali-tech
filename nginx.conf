upstream education_service {
    server education-content-service:8001;
}

upstream file_service {
    server file-service:8002;
}

server {
    listen 80;
    server_name localhost;

    # Lesson Service
    location /api/lessons {
        proxy_pass http://education_service/lessons;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Files Service
    location /api/files {
        proxy_pass http://file_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO Storage
    location /storage/ {
        proxy_pass http://minio:9000/;

        # Presigned URLs are signed for the internal MinIO host.
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        chunked_transfer_encoding off;
        proxy_request_buffering off;
        proxy_pass_header ETag;
        client_max_body_size 0;
    }
}
