services:
  frontend:
    container_name: frontend-magomedali-tech
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    environment:
      - API_INTERNAL_URL=http://education-content-service:8001
      - FILE_API_INTERNAL_URL=http://file-service:8002
      - STORAGE_INTERNAL_URL=http://minio:9000
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      education-content-service:
        condition: service_started
    restart: always

  education-content-service:
    container_name: education-content-service
    build:
      context: ./backend
      dockerfile: EducationContentService/Dockerfile
      secrets:
        - gh_token
    ports:
      - "8001:8001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8001
      - FileServiceOptions__Url=http://file-service:8002
    env_file:
      - path: education.service.env
        required: false
    depends_on:
      education-content-migrations:
        condition: service_completed_successfully
      file-service:
        condition: service_started
    restart: always

  education-content-migrations:
    container_name: education-content-migrations
    build:
      context: ./backend
      dockerfile: EducationContentService/Dockerfile
      secrets:
        - gh_token
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - ./efbundle
      - --connection
      - Host=postgres;Port=5432;Database=education_content;Username=postgres;Password=postgres

  file-service:
    container_name: file-service
    build:
      context: ./backend
      dockerfile: FileService/Dockerfile
      secrets:
        - gh_token
    ports:
      - "8002:8002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8002
    depends_on:
      file-service-db-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      redis:
        condition: service_started
      seq:
        condition: service_started
    restart: always

  file-service-db-init:
    image: postgres
    environment:
      PGPASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        psql -h postgres -U postgres -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'file_service_db'" | grep -q 1 ||
        psql -h postgres -U postgres -d postgres -c "CREATE DATABASE file_service_db"
    restart: "no"

  seq:
    container_name: seq-magomedali-tech
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "8081:80"
      - "5341:5341"
    restart: always
  postgres:
    container_name: postgres-magomedali-tech
    image: postgres
    environment:
      POSTGRES_DB: education_content
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  minio:
    container_name: minio-magomedali-tech
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9002:9002"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9002"
    volumes:
      - minio-data:/data
    restart: always

  redis:
    container_name: redis-magomedali-tech
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  nginx:
    container_name: nginx-magomedali-tech
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - education-content-service
      - file-service
    restart: always

volumes:
  postgres-data:
  minio-data:
  redis_data:

secrets:
  gh_token:
    environment: GH_PACKAGES_TOKEN
